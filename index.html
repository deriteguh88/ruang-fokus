<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruang Fokus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:inherit}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef3f4;--surface:#ffffff;--surface2:#e6eef0;--line:#d2dfe2;
  --text:#11262b;--muted:#587076;
  --accent:#14868f;--accent-soft:rgba(20,134,143,.12);--accent-ink:#ffffff;
  --ok:#2f9e4f;--danger:#c23b2a;--cell-ink:#0d1b1f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1115;--surface:#131c21;--surface2:#1a262c;--line:#26383f;
    --text:#e6f0f2;--muted:#8aa2a9;
    --accent:#3cc0c8;--accent-soft:rgba(60,192,200,.15);--accent-ink:#04262a;
    --ok:#6fd28a;--danger:#ff7a68;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1115;--surface:#131c21;--surface2:#1a262c;--line:#26383f;
  --text:#e6f0f2;--muted:#8aa2a9;
  --accent:#3cc0c8;--accent-soft:rgba(60,192,200,.15);--accent-ink:#04262a;
  --ok:#6fd28a;--danger:#ff7a68;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;margin:0;letter-spacing:-.01em}
.muted{color:var(--muted)}
p{margin:0}

.app{max-width:760px;margin:0 auto;padding:0 16px 108px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 0 8px}
.top-r{display:flex;gap:8px;align-items:center;flex:none}
h1{font-size:30px;line-height:1.1;font-weight:700}
.sub{margin-top:4px;color:var(--muted);font-size:13.5px}
.icon-btn{width:40px;height:40px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.icon-btn.sm{width:36px;height:36px;border-radius:10px}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn svg,.tab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sync{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.synced i{background:var(--ok)}
.sync.saving i,.sync.connecting i{background:var(--accent)}
.sync.error i{background:var(--danger)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{display:flex;max-width:760px;margin:0 auto}
.tab{flex:1;min-width:0;background:none;border:0;padding:9px 0 8px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600}
.tab span{max-width:100%;padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}

.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:24px 0 10px}
.sec h2{font-size:18px;font-weight:700}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;font-size:13.5px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list.inner{margin-top:12px;background:var(--surface2);border-color:transparent}
.row{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.list.inner .row{border-top-color:var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;background:none;border:0;padding:2px 0;text-align:left;display:flex;flex-direction:column;gap:3px}
.row-t{font-weight:600;overflow-wrap:anywhere}
.row-t.done{color:var(--muted);text-decoration:line-through}
.row-s{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12.5px;color:var(--muted)}
.chk{position:relative;flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);background:transparent;padding:0}
.chk::before{content:'';position:absolute;inset:-9px}
.chk.on{background:var(--accent);border-color:var(--accent)}
.chk.on::after{content:'';position:absolute;left:7px;top:2px;width:6px;height:12px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;color:var(--text);background:color-mix(in srgb,var(--c) 20%,transparent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip::before{content:'';flex:none;width:7px;height:7px;border-radius:50%;background:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ev{border-left:4px solid var(--c)}
.evtime{flex:none;width:52px;display:flex;flex-direction:column;font-size:13px;line-height:1.25}
.evtime span{color:var(--muted)}

.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.sm{padding:8px 12px;font-size:13px;margin-top:12px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

.hero{display:flex;align-items:center;gap:20px;padding:18px 18px 18px 14px;background:var(--surface);border:1px solid var(--line);border-radius:24px;margin-top:6px}
.ring{flex:none;display:block}
.ring-t{fill:var(--text);font-family:'Bricolage Grotesque',sans-serif;font-weight:700}
.hero-h{font-family:'Bricolage Grotesque',sans-serif;font-size:21px;font-weight:700;line-height:1.2;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,auto);gap:4px 18px;margin:0;justify-content:start}
.stats dt{font-size:12px;color:var(--muted)}
.stats dd{margin:0;font-weight:700;font-size:16px}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:20px;text-align:center}
.empty p{color:var(--muted);margin-bottom:14px}
.empty .actions{justify-content:center;margin-top:0}
.how{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin-top:14px}
.how h2{font-size:17px;margin-bottom:8px}
.how p{color:var(--muted);font-size:14px;margin-top:6px}
.how b{color:var(--text)}

.hchips{display:flex;flex-wrap:wrap;gap:8px}
.hchip{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:1.5px solid var(--c);background:transparent;font-weight:600;font-size:14px}
.hchip small{font-weight:500;color:var(--muted);font-size:12px}
.hchip[aria-pressed="true"]{background:var(--c);color:var(--cell-ink)}
.hchip[aria-pressed="true"] small{color:var(--cell-ink);opacity:.75}

.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent))}
.goal{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:14px 14px 14px 16px;margin-bottom:12px}
.goal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.goal h3{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.goal-pct{font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:700;line-height:1}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.gsum{display:flex;align-items:center;gap:16px;margin:6px 0 16px}
.gsum b{font-family:'Bricolage Grotesque',sans-serif;font-size:20px}
.mini{display:flex;flex-direction:column;gap:10px}
.mini-i{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:14px;font-weight:600}
.mini-i .bar{grid-column:1/-1}

.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 0 14px}
.nav strong{font-family:'Bricolage Grotesque',sans-serif;font-size:18px;text-align:center;flex:1}

.filters{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.filters input,.filters select{width:100%;font:inherit;font-size:15px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.filters .two{gap:8px}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:11.5px;color:var(--muted);font-weight:600}
.wd b{font-size:15px;color:var(--text)}
.wd.sel{border-color:var(--accent);background:var(--accent-soft)}
.wd.today b{color:var(--accent)}
.wprog{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:14px 0 6px}
.wprog b{color:var(--text)}

.hsum{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.hsum-t{flex:1;min-width:0}
.hsum-t b{font-family:'Bricolage Grotesque',sans-serif;font-size:17px;display:block;margin-bottom:6px}
.bars{display:block;width:100%;height:52px}
.bars .b{fill:var(--accent)}
.bars .base{fill:var(--line)}
.hgrid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);-webkit-overflow-scrolling:touch}
.hgrid{border-collapse:separate;border-spacing:0}
.hgrid th,.hgrid td{padding:0;text-align:center;font-weight:500}
.hgrid thead th{font-size:11px;color:var(--muted);padding:7px 0 5px;min-width:30px}
.hgrid thead b{display:block;font-size:13px;color:var(--text);font-weight:600}
.hgrid thead .w3{display:block;font-size:9.5px}
.hgrid thead .today b{color:var(--accent)}
.hgrid thead .wk .w3{opacity:.7}
.hgrid .hn{position:sticky;left:0;z-index:2;background:var(--surface);min-width:140px;max-width:140px;text-align:left;border-right:1px solid var(--line)}
.hgrid tbody th,.hgrid tbody td{border-top:1px solid var(--line)}
.hname{display:flex;flex-direction:column;gap:2px;width:100%;background:none;border:0;padding:8px 10px 8px 12px;text-align:left;border-left:4px solid var(--c)}
.hn-t{font-weight:600;font-size:13.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hn-s{font-size:11.5px;color:var(--muted);font-weight:500}
.hc{display:block;width:24px;height:24px;margin:5px 3px;border-radius:7px;border:1.5px solid var(--line);background:transparent;padding:0}
.hc.on{background:var(--c);border-color:var(--c)}
.hc:disabled{opacity:.3;cursor:default}
.hint{font-size:12.5px;color:var(--muted);margin-top:10px}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 0}
.cd{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;aspect-ratio:1/1.05;padding:6px 0 0;border-radius:12px;border:1.5px solid transparent;background:var(--surface);font-weight:600;font-size:14px}
.cd.other{opacity:.4}
.cd.today{border-color:var(--accent)}
.cd.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:32px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--c)}
.cd.sel .dot{box-shadow:0 0 0 1px var(--accent-ink)}

.agseg{margin-bottom:12px}
.dayblk{margin-bottom:14px}
.dayblk-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;width:100%;background:none;border:0;padding:6px 2px;text-align:left}
.dayblk-h b{font-family:'Bricolage Grotesque',sans-serif;font-size:16px}
.dayblk-h small{color:var(--muted);font-size:12.5px}
.dayblk.today .dayblk-h b{color:var(--accent)}
.tl{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tl-row{height:56px;border-top:1px solid var(--line);position:relative}
.tl-row:first-child{border-top:0}
.tl-row span{position:absolute;left:10px;top:5px;font-size:11.5px;color:var(--muted)}
.tl-body{position:absolute;left:58px;right:8px;top:0;bottom:0}
.tl-ev{position:absolute;display:flex;flex-direction:column;gap:1px;text-align:left;border:0;border-left:4px solid var(--c);border-radius:10px;padding:4px 8px;overflow:hidden;font-size:12px;line-height:1.25;background:color-mix(in srgb,var(--c) 24%,var(--surface));color:var(--text)}
.tl-ev b{font-size:13px;overflow:hidden;text-overflow:ellipsis}
.tl-ev span{color:var(--muted)}
.tl-task{flex-direction:row;align-items:flex-start;gap:8px;background:color-mix(in srgb,var(--c) 12%,var(--surface));border-left-style:dashed}
.tl-task.done b{text-decoration:line-through;color:var(--muted)}
.tl-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;background:none;border:0;padding:0;text-align:left}
.chk.mini{width:20px;height:20px;border-radius:6px;margin-top:1px}
.chk.mini.on::after{left:5px;top:1px;width:5px;height:10px}
.tl-now{position:absolute;left:52px;right:0;height:0;border-top:2px solid var(--danger);z-index:3;pointer-events:none}
.tl-now::before{content:'';position:absolute;left:-1px;top:-6px;width:9px;height:9px;border-radius:50%;background:var(--danger)}
.journal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.jnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;font-weight:600;font-size:14px}
.jnav span{flex:1;text-align:center}
.moods{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.mood{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.mood[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.journal textarea{width:100%;min-height:96px;resize:vertical;font:inherit;font-size:15px;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.jitem{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 2px}
.jitem:first-child{border-top:0}
.jitem b{display:block;font-size:14px}
.jitem small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.jitem p{font-size:13.5px;margin-top:4px;color:var(--text);overflow-wrap:anywhere}

.ringrow{display:flex;gap:10px;overflow-x:auto;padding:0 16px 6px;margin:0 -16px;scroll-snap-type:x proximity}
.gring{flex:none;width:106px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px;border:1px solid var(--line);border-radius:16px;background:var(--surface);text-align:center;font-size:12.5px;font-weight:600;scroll-snap-align:start}
.gring span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.dbars{display:flex;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px 10px}
.dbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.dbar b{font-size:11px;color:var(--text);font-weight:600}
.dcol{width:100%;height:64px;display:flex;align-items:flex-end;justify-content:center}
.dcol i{display:block;width:100%;max-width:28px;border-radius:6px;background:var(--accent);min-height:3px}
.dbar.none .dcol i{background:var(--line)}
.dbar.today span{color:var(--accent);font-weight:700}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-template-columns:repeat(10,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.hz{aspect-ratio:1;border-radius:5px;background:var(--surface2)}
.hz.fut{background:transparent}

.scrim{position:fixed;inset:0;background:rgba(5,12,15,.55);z-index:40}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:520px;max-height:90vh;max-height:90dvh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));z-index:41;animation:up .18s ease-out}
.sheet.still{animation:none}
@keyframes up{from{transform:translate(-50%,28px);opacity:0}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sheet-h h2{font-size:20px}
.sheet label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
.sheet input,.sheet select,.sheet textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.sheet input[type=range]{padding:0;height:28px;accent-color:var(--accent)}
.sheet textarea{min-height:76px;resize:vertical}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:32px;height:32px;border-radius:50%;background:var(--c);border:0;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.days{display:flex;gap:6px;margin-top:10px}
.dchip{flex:1;min-width:0;border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:8px 0;font-size:12.5px;font-weight:600}
.dchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.err{color:var(--danger);font-size:13px;margin-top:10px}
.sheet-f{display:flex;gap:10px;margin-top:20px}
.sheet-f .btn{flex:1}
.sheet-f .btn.danger{flex:none}
.sheet-del{display:flex;gap:8px;margin-top:16px}
.sheet-del .btn{flex:1;margin-top:0}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.warn{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--text);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.sgroup{margin-top:22px}
.sgroup h3{font-size:15px;margin-bottom:8px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.trow{display:flex;gap:8px;align-items:center;margin-top:8px}
.trow input{width:auto;flex:1;min-width:0}
.tog{flex:none;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;min-width:88px}
.tog[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.tog:disabled{opacity:.5;cursor:default}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;font-size:14px}
.setcol{display:flex;flex-direction:column;gap:10px}
#exp{margin-top:10px;min-height:120px;font-size:12px !important}

.toast{position:fixed;left:50%;bottom:calc(82px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:13px;z-index:60;max-width:90vw;text-align:center}
[hidden]{display:none !important}

async function flush(){

  try{
    for(;i<keys.length;i++){
      var k=keys[i],body={rev:S.rev[k]||Date.now(),v:S[k]};
      if(JSON.stringify(body).length>900000)throw {code:'too_large'};
      delete dirty[k];
      await docRef(k).set(body);
    }
    setSync(anyDirty()?'saving':'synced');

    for(var j=i;j<keys.length;j++)dirty[keys[j]]=true;
    failed=e&&e.code||'error';
    setSync('error',failed);
    if(failed!=='too_large'&&failed!=='invalid_argument'&&failed!=='revoked'){clearTimeout(retryT);retryT=setTimeout(schedulePush,15000)}

    if((lr>0||hasVal(k))&&!pushing){
      if(!S.rev[k])S.rev[k]=Date.now();
      dirty[k]=true;schedulePush();

}

function makeSB(){

function snapOf(row){return {exists:!!row,data:function(){return row},metadata:{fromCache:false}}}
function fetchKey(k){

        if(r.error)throw {code:r.error.code||'error',message:r.error.message};

    onSnapshot:function(next,err){

function startRemote(user){

/* ================= domain logic ================= */
function occursOn(it,d){
  var r=it.repeat;
  if(!r)return it.date===d;
  if(d<it.date)return false;
  if(r.until&&d>r.until)return false;
  if(it.skip&&it.skip[d])return false;
  var a=pd(it.date),b=pd(d),n=r.interval||1;
  if(r.freq==='daily')return diffDays(it.date,d)%n===0;
  if(r.freq==='weekly'){
    var days=(r.days&&r.days.length)?r.days:[a.getDay()];
    if(days.indexOf(b.getDay())<0)return false;
    return Math.round(diffDays(weekStart(it.date),weekStart(d))/7)%n===0;
  }
  if(r.freq==='monthly'){
    var m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();
    if(m<0||m%n)return false;
    return b.getDate()===Math.min(a.getDate(),daysInMonth(d.slice(0,7)));
  }
  return false;
}
function taskInst(t,d){return Object.assign({},t,{date:d,done:t.repeat?!!(t.doneOn&&t.doneOn[d]):!!t.done})}
function tasksOn(d,gid){return S.tasks.filter(function(t){return occursOn(t,d)&&(!gid||t.goalId===gid)}).map(function(t){return taskInst(t,d)})}
function eventsOn(d){
  return S.events.filter(function(e){return occursOn(e,d)}).map(function(e){return Object.assign({},e,{date:d})})
    .sort(function(a,b){return (a.start||'00:00')<(b.start||'00:00')?-1:1});
}
function nextOcc(it,from,skipDone){
  for(var i=0;i<400;i++){var d=addDays(from,i);if(occursOn(it,d)&&!(skipDone&&it.doneOn&&it.doneOn[d]))return d}
  return null;
}
function sortTasks(a){
  return a.slice().sort(function(x,y){
    if(!!x.done!==!!y.done)return x.done?1:-1;
    var tx=x.time||'99:99',ty=y.time||'99:99';
    if(tx!==ty)return tx<ty?-1:1;
    return String(x.title).localeCompare(String(y.title));
  });
}
function goalColor(t){var g=S.goals.find(function(x){return x.id===t.goalId});return g?col(g.color):null}

function habitRange(h,a,b){
  var td=TODAY(),s=a>h.created?a:h.created,e=b<td?b:td;
  if(s>e)return {n:0,done:0};
  var n=0,done=0,d,pw=h.perWeek||0;
  if(!pw){for(d=s;d<=e;d=addDays(d,1)){n++;if(h.log[d])done++}return {n:n,done:done}}
  for(var w=weekStart(s);w<=e;w=addDays(w,7)){
    var ws=w>s?w:s,we0=addDays(w,6),we=we0<e?we0:e,len=diffDays(ws,we)+1,cnt=0;
    for(d=ws;d<=we;d=addDays(d,1))if(h.log[d])cnt++;
    var exp=Math.min(pw,Math.ceil(pw*len/7));
    n+=exp;done+=Math.min(cnt,exp);
  }
  return {n:n,done:done};
}
function weekCount(h,ws){
  var s=ws||weekStart(TODAY()),e=addDays(s,6),c=0;
  for(var d=s;d<=e;d=addDays(d,1))if(h.log[d])c++;
  return c;
}
function monthStats(ym){
  var a=ym+'-01',b=ym+'-'+pad(daysInMonth(ym)),n=0,done=0;
  S.habits.forEach(function(h){var r=habitRange(h,a,b);n+=r.n;done+=r.done});
  return {n:n,done:done,p:n?done/n:0};
}
function streakInfo(h){
  var n=0;
  if(!h.perWeek){
    var d=TODAY();if(!h.log[d])d=addDays(d,-1);
    while(h.log[d]&&n<3650){n++;d=addDays(d,-1)}
    return {n:n,unit:'hari'};
  }
  var w=weekStart(TODAY());
  if(weekCount(h,w)>=h.perWeek)n++;
  w=addDays(w,-7);
  while(weekCount(h,w)>=h.perWeek&&n<520){n++;w=addDays(w,-7)}
  return {n:n,unit:'minggu'};
}
function habitRate30(h){var td=TODAY();var r=habitRange(h,addDays(td,-29),td);return r.n?r.done/r.n:0}
function goalProgress(g){
  var td=TODAY(),tot=0,dn=0,lh=S.habits.filter(function(h){return h.goalId===g.id});
  S.tasks.forEach(function(t){
    if(t.goalId!==g.id)return;
    if(!t.repeat){tot++;if(t.done)dn++;return}
    var start=t.date>addDays(td,-90)?t.date:addDays(td,-90);
    for(var d=start;d<=td;d=addDays(d,1))if(occursOn(t,d)){tot++;if(t.doneOn&&t.doneOn[d])dn++}
  });
  var comps=[],hRate=null;
  if(tot)comps.push(dn/tot);
  if(lh.length){hRate=lh.reduce(function(a,h){return a+habitRate30(h)},0)/lh.length;comps.push(hRate)}
  var p=comps.length?comps.reduce(function(a,b){return a+b},0)/comps.length:(Number(g.manual)||0)/100;
  return {p:Math.max(0,Math.min(1,p)),tDone:dn,tTotal:tot,hRate:hRate,auto:comps.length>0};
}
function goalOpen(g){
  var td=TODAY(),out=[];
  S.tasks.forEach(function(t){
    if(t.goalId!==g.id)return;
    if(!t.repeat){if(!t.done)out.push(taskInst(t,t.date))}
    else{var d=nextOcc(t,td,true);if(d)out.push(taskInst(t,d))}
  });
  return out.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0}).slice(0,3);
}
function dayCounts(d){
  var ts=tasksOn(d),ht=0,hd=0;
  S.habits.forEach(function(h){
    if(h.created>d)return;
    if(h.perWeek){if(h.log[d]){ht++;hd++}}else{ht++;if(h.log[d])hd++}
  });
  return {tt:ts.length,td:ts.filter(function(t){return t.done}).length,ht:ht,hd:hd};
}
function dayScore(d){var c=dayCounts(d),t=c.tt+c.ht;return t?(c.td+c.hd)/t:null}

/* ================= ui pieces ================= */
function ring(p,size,sw,color,label){
  p=Math.max(0,Math.min(1,p||0));
  var r=(size-sw)/2,c=2*Math.PI*r,h=size/2;
  var s='<svg class="ring" width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'" role="img" aria-label="'+(label!=null?esc(label):Math.round(p*100)+'%')+'">';
  s+='<circle cx="'+h+'" cy="'+h+'" r="'+r+'" fill="none" style="stroke:var(--line)" stroke-width="'+sw+'"/>';
  if(p>0)s+='<circle cx="'+h+'" cy="'+h+'" r="'+r+'" fill="none" style="stroke:'+color+'" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-p))+'" transform="rotate(-90 '+h+' '+h+')"/>';
  if(label!=null)s+='<text x="'+h+'" y="'+h+'" text-anchor="middle" dominant-baseline="central" class="ring-t" style="font-size:'+(size*0.24)+'px">'+esc(label)+'</text>';
  return s+'</svg>';
}
function chipGoal(gid){
  var g=S.goals.find(function(x){return x.id===gid});
  return g?'<span class="chip" style="--c:'+col(g.color)+'">'+esc(g.title)+'</span>':'';
}
function taskRow(t,o){
  o=o||{};
  var meta=(t.time?'<span>'+esc(t.time)+'</span>':'')+(o.date?'<span>'+fmtShort(t.date)+'</span>':'')+(t.repeat?'<span>Berulang</span>':'')+chipGoal(t.goalId);
  return '<div class="row"><button class="chk'+(t.done?' on':'')+'" data-act="toggleTask" data-id="'+t.id+'" data-date="'+t.date+'" aria-pressed="'+(!!t.done)+'" aria-label="Selesai: '+esc(t.title)+'"></button>'+
    '<button class="row-main" data-act="editTask" data-id="'+t.id+'" data-date="'+t.date+'"><span class="row-t'+(t.done?' done':'')+'">'+esc(t.title)+'</span>'+(meta?'<span class="row-s">'+meta+'</span>':'')+'</button></div>';
}
function eventRow(e){
  var g=chipGoal(e.goalId);
  var time=e.start?'<b>'+esc(e.start)+'</b>'+(e.end?'<span>'+esc(e.end)+'</span>':''):'<span>Seharian</span>';
  var meta=(e.repeat?'<span>Berulang</span>':'')+g;
  return '<div class="row ev" style="--c:'+col(e.color)+'"><div class="evtime">'+time+'</div>'+
    '<button class="row-main" data-act="editEvent" data-id="'+e.id+'" data-date="'+e.date+'"><span class="row-t">'+esc(e.title)+'</span>'+(meta?'<span class="row-s">'+meta+'</span>':'')+'</button></div>';
}
function empty(msg,label,act,extra){
  return '<div class="empty"><p>'+msg+'</p><div class="actions"><button class="btn primary" data-act="'+act+'"'+(extra||'')+'>'+label+'</button></div></div>';
}
function secHead(title,linkLabel,act,extra){
  return '<div class="sec"><h2>'+title+'</h2>'+(linkLabel?'<button class="link" data-act="'+act+'"'+(extra||'')+'>'+linkLabel+'</button>':'')+'</div>';
}
function deadlineInfo(g){
  if(!g.deadline)return '';
  var diff=diffDays(TODAY(),g.deadline),t=fmtShort(g.deadline,true);
  if(diff<0)return 'Tenggat '+t+', terlewat '+(-diff)+' hari';
  if(diff===0)return 'Tenggat hari ini';
  return 'Tenggat '+t+', '+diff+' hari lagi';
}
function goalMini(g){
  var gp=goalProgress(g);
  return '<div class="mini-i" style="--c:'+col(g.color)+'"><span>'+esc(g.title)+'</span><span>'+Math.round(gp.p*100)+'%</span><div class="bar"><i style="width:'+(gp.p*100)+'%"></i></div></div>';
}
function goalCard(g){
  var gp=goalProgress(g),open=goalOpen(g),hs=S.habits.filter(function(h){return h.goalId===g.id});
  var facts=[];
  if(gp.tTotal)facts.push('Tugas '+gp.tDone+'/'+gp.tTotal);
  if(gp.hRate!=null)facts.push('Kebiasaan '+Math.round(gp.hRate*100)+'% dalam 30 hari');
  if(!gp.auto)facts.push('Belum ada tugas atau kebiasaan terkait, progres diatur manual');
  var dl=deadlineInfo(g);
  return '<article class="goal" style="--c:'+col(g.color)+'">'+
    '<div class="goal-h"><div><h3>'+esc(g.title)+'</h3>'+(dl?'<p class="muted" style="font-size:13px;margin-top:3px">'+dl+'</p>':'')+'</div><div class="goal-pct">'+Math.round(gp.p*100)+'%</div></div>'+
    '<div class="bar"><i style="width:'+(gp.p*100)+'%"></i></div>'+
    '<div class="facts">'+facts.map(function(f){return '<span>'+f+'</span>'}).join('')+'</div>'+
    (open.length?'<div class="list inner">'+open.map(function(t){return taskRow(t,{date:true})}).join('')+'</div>':'')+
    (hs.length?'<div class="chips">'+hs.map(function(h){return '<span class="chip" style="--c:'+col(h.color)+'">'+esc(h.title)+'</span>'}).join('')+'</div>':'')+
    (g.note?'<p class="muted" style="font-size:13.5px;margin-top:10px">'+esc(g.note)+'</p>':'')+
    '<button class="btn ghost sm" data-act="editGoal" data-id="'+g.id+'">Ubah target</button></article>';
}

/* ---------- dashboard blocks ---------- */
function dashBlocks(){
  var td=TODAY(),h='';
  if(S.goals.length){
    h+=secHead('Ringkasan target','Semua target','tab',' data-tab="goals"')+'<div class="ringrow">'+S.goals.map(function(g){
      var p=goalProgress(g).p;
      return '<div class="gring">'+ring(p,72,8,col(g.color),Math.round(p*100)+'%')+'<span>'+esc(g.title)+'</span></div>';
    }).join('')+'</div>';
  }
  var days=[];for(var i=6;i>=0;i--)days.push(addDays(td,-i));
  h+=secHead('7 hari terakhir','','')+'<div class="dbars">'+days.map(function(d){
    var s=dayScore(d),p=s==null?0:Math.round(s*100);
    return '<div class="dbar'+(s==null?' none':'')+(d===td?' today':'')+'" aria-label="'+fmtDay(d)+': '+(s==null?'tidak ada rencana':p+' persen selesai')+'"><b>'+(s==null?'–':p+'%')+'</b><div class="dcol"><i style="height:'+(s==null?4:Math.max(4,p))+'%"></i></div><span>'+DAY3[pd(d).getDay()]+'</span></div>';
  }).join('')+'</div>';
  var start=addDays(weekStart(td),-63),cells='';
  for(var c=0;c<10;c++)for(var r=0;r<7;r++){
    var d=addDays(start,c*7+r);
    if(d>td){cells+='<div class="hz fut"></div>';continue}
    var s=dayScore(d);
    cells+='<div class="hz" title="'+fmtShort(d)+'" style="'+(s==null?'':'background:color-mix(in srgb,var(--accent) '+Math.round(20+s*80)+'%,var(--surface2))')+'"></div>';
  }
  h+=secHead('Aktivitas 10 minggu','','')+'<div class="heat" role="img" aria-label="Peta aktivitas 10 minggu terakhir">'+cells+'</div><p class="hint">Warna makin pekat berarti makin banyak tugas dan kebiasaan yang selesai pada hari itu.</p>';
  return h;
}
function journalBlock(){
  var td=TODAY(),d=UI.noteDay||td,n=(S.notes||{})[d]||{mood:0,text:''};

/* ================= views ================= */

  var total=c.tt+c.ht,done=c.td+c.hd,score=total?done/total:null;

  var msg=isEmpty?'Mulai dari satu hal kecil.':total===0?'Belum ada rencana untuk hari ini.':done===total?'Semua sudah selesai hari ini.':(total-done)+' hal lagi hari ini.';
  var h='<section class="hero">'+ring(score||0,124,12,'var(--accent)',score==null?'0%':Math.round(score*100)+'%')+
    '<div><div class="hero-h">'+msg+'</div><dl class="stats"><div><dt>Tugas</dt><dd>'+c.td+'/'+c.tt+'</dd></div><div><dt>Kebiasaan</dt><dd>'+c.hd+'/'+c.ht+'</dd></div><div><dt>Acara</dt><dd>'+evs.length+'</dd></div></dl></div></section>';

      '<p><b>Agenda</b> menampilkan acara dan tugas berjam dalam satu kalender, dan halaman ini merangkum semuanya untuk hari ini.</p>'+
      '<div class="actions"><button class="btn primary" data-act="newGoal">Buat target pertama</button><button class="btn ghost" data-act="sample">Muat data contoh</button></div></div>';
    return h;
  }
  if(evs.length)h+=secHead('Agenda hari ini','Buka agenda','tab',' data-tab="agenda"')+'<div class="list">'+evs.map(eventRow).join('')+'</div>';
  h+=secHead('Tugas hari ini','Tambah tugas','newTask',' data-date="'+td+'"');
  h+=tasks.length?'<div class="list">'+tasks.map(function(t){return taskRow(t)}).join('')+'</div>':'<div class="empty"><p>Belum ada tugas untuk hari ini.</p><div class="actions"><button class="btn ghost" data-act="newTask" data-date="'+td+'">Tambah tugas</button></div></div>';
  if(hs.length){
    h+=secHead('Kebiasaan hari ini','Lihat pola','tab',' data-tab="habits"')+'<div class="hchips">'+hs.map(function(x){
      var on=!!x.log[td],s=streakInfo(x),small='';
      if(x.perWeek)small='<small>'+weekCount(x)+'/'+x.perWeek+' minggu ini</small>';
      else if(s.n>1)small='<small>'+s.n+' hari</small>';
      return '<button class="hchip" style="--c:'+col(x.color)+'" data-act="toggleHabit" data-id="'+x.id+'" data-date="'+td+'" aria-pressed="'+on+'">'+esc(x.title)+small+'</button>';

  else if(S.goals.length)h+=secHead('Progres target','Semua target','tab',' data-tab="goals"')+'<div class="mini">'+S.goals.slice(0,4).map(goalMini).join('')+'</div>';
  if(cf.journal)h+=journalBlock();
  return h;

  if(!S.goals.length)return empty('Belum ada target. Tulis satu hal besar yang ingin kamu capai, lalu hubungkan tugas dan kebiasaan ke sana.','Buat target','newGoal');

  var h='<div class="gsum">'+ring(avg,84,9,'var(--accent)',Math.round(avg*100)+'%')+'<div><b>'+S.goals.length+' target</b><p class="muted" style="font-size:13.5px;margin-top:3px">'+reached+' tercapai. Rata-rata progres dihitung dari tugas dan kebiasaan terkait.</p></div></div>';

var tm=function(s){var a=(s||'').split(':');return a.length===2&&a[0]!==''?Number(a[0])*60+Number(a[1]):null};
function dayItems(d){
  var evs=eventsOn(d).map(function(e){return {k:'e',o:e,t:e.start||''}});
  var tks=tasksOn(d).map(function(t){return {k:'t',o:t,t:t.time||''}});
  return evs.concat(tks).sort(function(a,b){
    if(a.t!==b.t){if(!a.t)return -1;if(!b.t)return 1;return a.t<b.t?-1:1}
    return a.k<b.k?-1:a.k>b.k?1:0;
  });
}
function itemRow(it){return it.k==='e'?eventRow(it.o):taskRow(it.o)}
function addButtons(d){
  return '<div class="actions"><button class="btn primary" data-act="newEvent" data-date="'+d+'">Tambah acara</button><button class="btn ghost" data-act="newTask" data-date="'+d+'">Tambah tugas</button></div>';
}
function agHeader(v){

  if(v==='month'){var a=UI.agMonth.split('-').map(Number);label=MONTHS[a[1]-1]+' '+a[0];isNow=UI.agMonth===td.slice(0,7);noun='bulan ini'}
  else if(v==='week'){
    var ws=weekStart(UI.agDay),da=pd(ws),db=pd(addDays(ws,6));
    label=da.getMonth()===db.getMonth()?da.getDate()+'–'+db.getDate()+' '+MONTHS[da.getMonth()]+' '+da.getFullYear():da.getDate()+' '+MON3[da.getMonth()]+' – '+db.getDate()+' '+MON3[db.getMonth()]+' '+db.getFullYear();
    isNow=ws===weekStart(td);noun='minggu ini';
  }else{label=fmtLong(UI.agDay);isNow=UI.agDay===td;noun='hari ini'}
  var h='<div class="seg agseg" role="group" aria-label="Tampilan agenda">'+[['month','Bulan'],['week','Minggu'],['day','Hari']].map(function(o){return '<button data-act="agView" data-v="'+o[0]+'" aria-pressed="'+(v===o[0])+'">'+o[1]+'</button>'}).join('')+'</div>';
  h+='<div class="nav"><button class="icon-btn" data-act="aNav" data-n="-1" aria-label="Sebelumnya">'+I.left+'</button><strong>'+label+'</strong><button class="icon-btn" data-act="aNav" data-n="1" aria-label="Berikutnya">'+I.right+'</button></div>';
  if(!isNow)h+='<div style="text-align:center;margin:-6px 0 10px"><button class="link" data-act="agToday">Kembali ke '+noun+'</button></div>';

function agMonthBody(){
  var td=TODAY(),ym=UI.agMonth,first=ym+'-01',last=ym+'-'+pad(daysInMonth(ym)),d=weekStart(first),cells=[];
  while(d<=last||cells.length%7!==0){cells.push(d);d=addDays(d,1)}

  cells.forEach(function(c){

    h+='<button class="cd'+(c.slice(0,7)!==ym?' other':'')+(c===td?' today':'')+(c===UI.agDay?' sel':'')+'" data-act="agSel" data-date="'+c+'" aria-pressed="'+(c===UI.agDay)+'" aria-label="'+fmtLong(c)+'"><span>'+pd(c).getDate()+'</span><span class="dots">'+dots.slice(0,4).map(function(x){return '<i class="dot" style="--c:'+x+'"></i>'}).join('')+'</span></button>';
  });

function agWeekBody(){
  var td=TODAY(),ws=weekStart(UI.agDay),h='';
  for(var i=0;i<7;i++){
    var d=addDays(ws,i),items=dayItems(d);
    var ne=items.filter(function(x){return x.k==='e'}).length,nt=items.length-ne;
    var sum=items.length?(ne?ne+' acara':'')+(ne&&nt?', ':'')+(nt?nt+' tugas':''):'Tidak ada rencana';
    h+='<section class="dayblk'+(d===td?' today':'')+'"><button class="dayblk-h" data-act="agOpenDay" data-date="'+d+'" aria-label="Buka rincian '+fmtDay(d)+'"><b>'+fmtDay(d)+'</b><small>'+sum+'</small></button>'+(items.length?'<div class="list">'+items.map(itemRow).join('')+'</div>':'')+'</section>';
  }
  return h+addButtons(UI.agDay);
}
function layoutItems(items){
  items.sort(function(a,b){return a.s-b.s||b.e-a.e});
  var cluster=[],end=-1;
  function flush(){
    if(!cluster.length)return;
    var ends=[];
    cluster.forEach(function(it){var c=0;while(ends[c]>it.s)c++;ends[c]=it.e;it.col=c});
    cluster.forEach(function(it){it.n=ends.length});
    cluster=[];
  }
  items.forEach(function(it){if(it.s>=end)flush();cluster.push(it);end=Math.max(end,it.e)});
  flush();
}
function timeline(d){
  var items=[];
  eventsOn(d).forEach(function(e){
    var s=tm(e.start);if(s==null)return;
    var en=tm(e.end);if(en==null)en=s+60;if(en<=s)en=s+30;
    items.push({k:'e',o:e,s:s,e:en});
  });
  tasksOn(d).forEach(function(t){var s=tm(t.time);if(s==null)return;items.push({k:'t',o:t,s:s,e:s+30})});
  if(!items.length)return '';
  var minS=Math.min.apply(null,items.map(function(x){return x.s})),maxE=Math.max.apply(null,items.map(function(x){return x.e}));
  var h0=Math.max(0,Math.min(6,Math.floor(minS/60))),h1=Math.min(24,Math.max(22,Math.ceil(maxE/60))),PX=56;
  layoutItems(items);
  var rows='';
  for(var hh=h0;hh<h1;hh++)rows+='<div class="tl-row"><span>'+pad(hh)+':00</span></div>';
  var blocks=items.map(function(it){
    var w=100/it.n,st='top:'+((it.s-h0*60)/60*PX)+'px;height:'+Math.max(28,(it.e-it.s)/60*PX-2)+'px;left:calc('+(it.col*w)+'% + 1px);width:calc('+w+'% - 3px)';
    if(it.k==='e'){
      var e=it.o;
      return '<button class="tl-ev" style="--c:'+col(e.color)+';'+st+'" data-act="editEvent" data-id="'+e.id+'" data-date="'+e.date+'"><b>'+esc(e.title)+'</b><span>'+esc(e.start)+(e.end?'–'+esc(e.end):'')+'</span></button>';
    }
    var t=it.o;
    return '<div class="tl-ev tl-task'+(t.done?' done':'')+'" style="--c:'+(goalColor(t)||'var(--accent)')+';'+st+'"><button class="chk mini'+(t.done?' on':'')+'" data-act="toggleTask" data-id="'+t.id+'" data-date="'+t.date+'" aria-pressed="'+(!!t.done)+'" aria-label="Selesai: '+esc(t.title)+'"></button><button class="tl-t" data-act="editTask" data-id="'+t.id+'" data-date="'+t.date+'"><b>'+esc(t.title)+'</b><span>'+esc(t.time)+'</span></button></div>';
  }).join('');
  var now='',n=new Date(),nm=n.getHours()*60+n.getMinutes();
  if(d===TODAY()&&nm>=h0*60&&nm<h1*60)now='<div class="tl-now" style="top:'+((nm-h0*60)/60*PX)+'px"></div>';
  return '<div class="tl" id="tl" data-h0="'+h0+'" data-first="'+minS+'" style="height:'+((h1-h0)*PX)+'px">'+rows+'<div class="tl-body">'+blocks+'</div>'+now+'</div>';
}
function agDayBody(){
  var d=UI.agDay,items=dayItems(d),flat=items.filter(function(x){return !x.t}),h='';
  if(flat.length)h+=secHead('Seharian dan tanpa jam','','')+'<div class="list">'+flat.map(itemRow).join('')+'</div>';

  if(isNew)obj={id:uid()};
  obj.title=title;
  if(sh.type==='goal'){obj.color=sh.color;obj.deadline=val('f-date');obj.note=val('f-note');obj.manual=Number(val('f-manual'))||0}
  if(sh.type==='task'||sh.type==='event'){
    obj.date=val('f-date')||TODAY();
    var rv=val('f-rep')||'none',until=val('f-until');
    if(rv!=='none'&&until&&until<obj.date){setErr('Tanggal akhir pengulangan harus setelah tanggal mulai.');return}
    if(rv==='none'){delete obj.repeat}
    else{
      obj.repeat={freq:{d:'daily',w:'weekly',m:'monthly'}[rv[0]],interval:Number(rv.slice(1)),days:rv[0]==='w'?sh.days.slice().sort():[],until:until||''};
      if(!obj.skip)obj.skip={};
      if(sh.type==='task'&&!obj.doneOn)obj.doneOn={};
    }
    obj.goalId=val('f-goal');
    if(sh.type==='task'){obj.time=val('f-time');if(isNew)obj.done=false}
    if(sh.type==='event'){obj.start=val('f-start');obj.end=val('f-end');obj.color=sh.color}
  }
  if(sh.type==='habit'){obj.color=sh.color;obj.goalId=val('f-goal');obj.perWeek=Number(val('f-freq'))||0;if(isNew){obj.log={};obj.created=TODAY()}}
  if(isNew)coll.push(obj);
  save();
  if(sh.type==='task')UI.taskDay=obj.date;
  closeSheet();render();toast('Tersimpan');
}
function armTap(el,label,fn){
  if(el.dataset.armed){fn();return}
  el.dataset.armed='1';var old=el.textContent;el.textContent=label;
  setTimeout(function(){if(el.isConnected){delete el.dataset.armed;el.textContent=old}},4000);
}
function delItem(el){
  var sh=UI.sheet;if(!sh||!sh.id)return;
  armTap(el,'Ketuk lagi untuk menghapus',function(){
    var key=COLL[sh.type];
    S[key]=S[key].filter(function(x){return x.id!==sh.id});
    if(sh.type==='goal'){
      ['tasks','habits','events'].forEach(function(k){S[k].forEach(function(x){if(x.goalId===sh.id)x.goalId=''})});
    }
    save();closeSheet();render();toast('Dihapus');
  });
}
function delOcc(el){
  var sh=UI.sheet;if(!sh||!sh.id||!sh.occ)return;
  armTap(el,'Ketuk lagi untuk menghapus',function(){
    var it=S[COLL[sh.type]].find(function(x){return x.id===sh.id});
    if(it){if(!it.skip)it.skip={};it.skip[sh.occ]=1}
    save();closeSheet();render();toast('Kejadian dihapus');
  });
}

/* ================= settings helpers ================= */
function updSet(fn,keepSheet){
  var s=clone(S.settings||{});fn(s);S.settings=s;
  save();applySettings();buildTabs();render();
  if(UI.sheet&&UI.sheet.type==='settings')renderSheet();
}

/* ================= data tools ================= */
function sampleData(){
  var t=TODAY(),g1=uid(),g2=uid(),g3=uid();
  var T=function(off,title,gid,time,done){return {id:uid(),title:title,date:addDays(t,off),time:time||'',goalId:gid||'',done:!!done}};
  var Hb=function(title,color,gid,k,pw){
    var log={};
    for(var i=0;i<=20;i++){var on=i===0?(k%2===0):((i*7+k*3+2)%(pw?3:5)!==0);if(on)log[addDays(t,-i)]=1}
    return {id:uid(),title:title,color:color,goalId:gid,created:addDays(t,-20),log:log,perWeek:pw||0};
  };
  var E=function(off,title,start,end,color,gid){return {id:uid(),title:title,date:addDays(t,off),start:start,end:end,color:color,goalId:gid||''}};
  var review=T(-14,'Tinjau target mingguan',g1,'16:00',false);
  review.repeat={freq:'weekly',interval:1,days:[pd(addDays(t,-14)).getDay()],until:''};review.doneOn={};review.doneOn[addDays(t,-7)]=1;review.skip={};
  var meet=E(-14,'Rapat mingguan tim','10:00','11:00','orange','');
  meet.repeat={freq:'weekly',interval:1,days:[pd(addDays(t,-14)).getDay()],until:''};meet.skip={};
  var notes={};
  notes[addDays(t,-1)]={mood:4,text:'Draf bagian metode selesai. Besok fokus ke pendahuluan.'};
  notes[addDays(t,-2)]={mood:3,text:'Hari yang padat, tapi tetap sempat olahraga.'};
  return {
    goals:[
      {id:g1,title:'Selesaikan draf artikel jurnal',color:'purple',deadline:addDays(t,45),note:'',manual:0},
      {id:g2,title:'Hidup lebih sehat',color:'green',deadline:addDays(t,90),note:'',manual:0},
      {id:g3,title:'Naikkan kemampuan bahasa Inggris',color:'blue',deadline:addDays(t,120),note:'',manual:0}
    ],
    tasks:[
      T(-2,'Kumpulkan referensi tambahan',g1,'',true),T(-1,'Tulis bagian metode',g1,'',true),T(-1,'Daftar kelas olahraga',g2,'',false),
      T(0,'Tulis bagian pendahuluan',g1,'09:00',false),T(0,'Siapkan dataset untuk analisis',g1,'',true),T(0,'Belanja sayur dan buah',g2,'',false),T(0,'Latihan listening 30 menit',g3,'20:00',false),
      T(1,'Revisi bagian metode',g1,'10:00',false),T(2,'Jalan pagi 5 km',g2,'06:00',false),T(3,'Kirim draf ke pembimbing',g1,'',false),T(4,'Ikuti tes latihan',g3,'',false),review
    ],
    habits:[Hb('Tulis 500 kata','purple',g1,0,0),Hb('Olahraga 30 menit','green',g2,1,3),Hb('Latihan bahasa Inggris','blue',g3,2,0),Hb('Tidur sebelum jam 23.00','orange','',3,0)],
    events:[E(0,'Bimbingan dengan dosen','13:00','14:00','teal',g1),E(1,'Makan malam keluarga','18:30','','pink'),E(2,'Kelas bahasa Inggris','19:00','20:30','blue',g3),E(5,'Seminar proposal','09:00','11:00','red',g1),meet],
    notes:notes,settings:{}
  };
}
function hasData(){return S.goals.length||S.tasks.length||S.habits.length||S.events.length||Object.keys(S.notes||{}).length}
function keepRev(next){next.rev=S.rev;return next}
function loadSample(el){
  var go=function(){S=keepRev(norm(sampleData()));save();applySettings();buildTabs();closeSheet();UI.tab='home';render();toast('Data contoh dimuat')};
  if(hasData()&&el)armTap(el,'Ketuk lagi untuk menimpa data',go);else go();
}
function wipe(el){
  armTap(el,'Ketuk lagi untuk menghapus semua',function(){S=keepRev(norm({}));save();applySettings();buildTabs();closeSheet();UI.tab='home';render();toast('Semua data dihapus')});
}
function exportData(){
  var data=JSON.stringify(S,null,2),name='ruang-fokus-'+TODAY()+'.json';
  var fallback=function(){try{var b=new Blob([data],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);toast('Berkas diunduh');return}catch(e){}var ta=$('exp');if(ta){ta.hidden=false;ta.value=data;ta.focus();ta.select();toast('Salin teks ini dan simpan sendiri')}};
  if(DL){DL.save({filename:name,data:data}).then(function(){toast('Berkas siap disimpan')}).catch(function(e){if(!e||e.code!=='declined')fallback()})}
  else fallback();
}
function importFile(f){
  if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(String(r.result));
      if(!o||typeof o!=='object'||!KEYS.some(function(k){return o[k]!=null}))throw new Error('format');
      S=keepRev(norm(o));save();applySettings();buildTabs();closeSheet();render();toast('Data berhasil diimpor');
    }catch(e){toast('Berkas tidak dikenali')}
  };
  r.onerror=function(){toast('Gagal membaca berkas')};
  r.readAsText(f);
}
var toastT=null;
function toast(m){
  var t=$('toast');t.textContent=m;t.hidden=false;
  clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2200);
}

/* ================= actions ================= */
var noteT=null;
function saveNoteSoon(){clearTimeout(noteT);noteT=setTimeout(save,700)}
var A={
  tab:function(el){
    var c=cfg(),k=el.dataset.tab;
    if(k!=='home'&&c.hidden[k])return;
    UI.tab=k;if(k==='habits')UI.gridReset=true;window.scrollTo(0,0);render();
  },
  toggleTask:function(el){
    var t=S.tasks.find(function(x){return x.id===el.dataset.id});if(!t)return;
    if(t.repeat){if(!t.doneOn)t.doneOn={};var d=el.dataset.date;if(t.doneOn[d])delete t.doneOn[d];else t.doneOn[d]=1}
    else t.done=!t.done;
    save();render();
  },
  toggleHabit:function(el){
    var h=S.habits.find(function(x){return x.id===el.dataset.id});if(!h)return;
    var d=el.dataset.date;if(d>TODAY())return;
    if(h.log[d])delete h.log[d];else{h.log[d]=1;if(d<h.created)h.created=d}
    save();render();
  },
  editTask:function(el){openSheet('task',el.dataset.id,{occ:el.dataset.date})},
  editGoal:function(el){openSheet('goal',el.dataset.id)},
  editHabit:function(el){openSheet('habit',el.dataset.id)},
  editEvent:function(el){openSheet('event',el.dataset.id,{occ:el.dataset.date})},
  newTask:function(el){openSheet('task',null,{date:el.dataset.date||TODAY()})},
  newGoal:function(){openSheet('goal')},
  newHabit:function(){openSheet('habit')},
  newEvent:function(el){openSheet('event',null,{date:el.dataset.date||TODAY()})},
  selDay:function(el){UI.taskDay=el.dataset.date;render()},
  wkNav:function(el){UI.taskDay=addDays(UI.taskDay,7*Number(el.dataset.n));render()},
  wkToday:function(){UI.taskDay=TODAY();render()},
  clearQ:function(){UI.q='';render()},
  hNav:function(el){UI.habitMonth=addMonth(UI.habitMonth,Number(el.dataset.n));UI.gridReset=true;render()},
  aNav:function(el){
    var n=Number(el.dataset.n),v=UI.agView||'month';
    if(v==='month'){
      UI.agMonth=addMonth(UI.agMonth,n);
      UI.agDay=UI.agMonth===TODAY().slice(0,7)?TODAY():UI.agMonth+'-01';
    }else{
      UI.agDay=addDays(UI.agDay,v==='week'?7*n:n);
      UI.agMonth=UI.agDay.slice(0,7);
      if(v==='day')UI.agFocus=true;
    }
    render();
  },
  agView:function(el){
    UI.agView=el.dataset.v;
    UI.agMonth=UI.agDay.slice(0,7);
    if(UI.agView==='day')UI.agFocus=true;
    render();
  },
  agToday:function(){UI.agDay=TODAY();UI.agMonth=UI.agDay.slice(0,7);if(UI.agView==='day')UI.agFocus=true;render()},
  agOpenDay:function(el){UI.agDay=el.dataset.date;UI.agMonth=UI.agDay.slice(0,7);UI.agView='day';UI.agFocus=true;window.scrollTo(0,0);render()},
  agSel:function(el){UI.agDay=el.dataset.date;UI.agMonth=UI.agDay.slice(0,7);render()},
  moveOverdue:function(){
    var td=TODAY(),n=0;
    S.tasks.forEach(function(t){if(!t.repeat&&t.date<td&&!t.done&&(!UI.fGoal||t.goalId===UI.fGoal)){t.date=td;n++}});
    save();UI.taskDay=td;render();toast(n+' tugas dipindahkan');
  },
  jNav:function(el){
    var d=addDays(UI.noteDay||TODAY(),Number(el.dataset.n));
    if(d>TODAY())return;UI.noteDay=d;render();
  },
  setMood:function(el){
    var d=UI.noteDay||TODAY(),m=Number(el.dataset.m),n=S.notes[d]||{mood:0,text:''};
    var ta=$('jtext');if(ta)n.text=ta.value;
    n.mood=n.mood===m?0:m;
    if(!n.mood&&!n.text)delete S.notes[d];else S.notes[d]=n;
    save();render();
  },
  openJournal:function(){openSheet('journal')},
  openNote:function(el){UI.noteDay=el.dataset.date;UI.tab='home';closeSheet();buildTabs();render();window.scrollTo(0,document.body.scrollHeight)},
  openSettings:function(){openSheet('settings')},
  closeSheet:closeSheet,saveSheet:saveSheet,delItem:delItem,delOcc:delOcc,
  sample:function(el){loadSample(el)},
  wipe:wipe,exportData:exportData,
  importPick:function(){var i=$('imp');if(i)i.click()},
  authIn:function(){authGo('in')},authUp:function(){authGo('up')},authOut:function(){if(SB)SB.auth.signOut()},
  syncNow:function(){KEYS.forEach(function(k){dirty[k]=true});schedulePush();refetchAll()},
  pickColor:function(el){
    if(!UI.sheet)return;UI.sheet.color=el.dataset.color;
    Array.prototype.forEach.call(document.querySelectorAll('#sw .sw'),function(b){b.setAttribute('aria-pressed',b===el?'true':'false')});
  },
  toggleDay:function(el){
    if(!UI.sheet)return;var d=Number(el.dataset.d),i=UI.sheet.days.indexOf(d);
    if(i>=0)UI.sheet.days.splice(i,1);else UI.sheet.days.push(d);
    el.setAttribute('aria-pressed',i<0?'true':'false');
  },
  setTheme:function(el){updSet(function(s){s.theme=el.dataset.v})},
  setWeek:function(el){updSet(function(s){s.weekStart=Number(el.dataset.v)})},
  setOpt:function(el){var o=el.dataset.o;updSet(function(s){s[o]=!(s[o]!==false)})},
  tabVis:function(el){var k=el.dataset.k;updSet(function(s){if(!s.hidden)s.hidden={};s.hidden[k]=!s.hidden[k]})},
  tabMove:function(el){
    var k=el.dataset.k,n=Number(el.dataset.n);
    updSet(function(s){
      var o=cfg().order.slice(),i=o.indexOf(k),j=i+n;
      if(j<0||j>=o.length)return;
      o.splice(i,1);o.splice(j,0,k);s.order=o;
    });
  }
};

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  var fn=A[el.dataset.act];
  if(fn)fn(el);
});
document.addEventListener('input',function(e){
  var t=e.target;if(!t)return;
  if(t.id==='f-manual'){var v=$('f-manual-v');if(v)v.textContent=t.value}
  else if(t.id==='tq'){UI.q=t.value;refreshTaskArea()}
  else if(t.id==='jtext'){
    var d=UI.noteDay||TODAY(),n=S.notes[d]||{mood:0,text:''};
    n.text=t.value;
    if(!n.mood&&!n.text)delete S.notes[d];else S.notes[d]=n;
    saveNoteSoon();
  }
});
document.addEventListener('change',function(e){
  var t=e.target;if(!t)return;
  if(t.id==='imp'){importFile(t.files&&t.files[0]);t.value=''}
  else if(t.id==='tfg'){UI.fGoal=t.value;refreshTaskArea()}
  else if(t.id==='tfs'){UI.fStatus=t.value;refreshTaskArea()}
  else if(t.id==='f-rep'){
    var v=t.value,rd=$('rep-days'),ru=$('rep-until');
    if(rd)rd.hidden=v[0]!=='w';if(ru)ru.hidden=v==='none';
  }
  else if(t.classList&&t.classList.contains('tn')){
    var k=t.dataset.k,nm=t.value.trim();
    updSet(function(s){if(!s.names)s.names={};if(nm)s.names[k]=nm;else delete s.names[k]});
  }
});
document.addEventListener('focusout',function(){
  if(UI.pendingRender){setTimeout(function(){
    var a=document.activeElement;
    if(!(a&&$('view').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){UI.pendingRender=false;render()}
  },50)}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&UI.sheet)closeSheet();
  if(e.key==='Enter'&&e.target&&e.target.id==='f-title'&&UI.sheet)saveSheet();
});
document.addEventListener('visibilitychange',function(){
  if(document.hidden){clearTimeout(noteT);save()}
  else if(!UI.sheet)softRender();
});
window.addEventListener('pagehide',function(){clearTimeout(noteT);save()});

document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target&&e.target.id==='au-pass')authGo('in')});
document.addEventListener('visibilitychange',function(){if(!document.hidden)refetchAll()});

/* ================= init ================= */
load();
applySettings();
buildTabs();
render();
initSync();
})();
</script>
</body>
